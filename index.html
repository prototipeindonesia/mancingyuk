<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MancingYuk! - Mobile App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Biru MancingYuk
                        secondary: '#22c55e', // Hijau
                        accent: '#f59e0b', // Kuning/Orange
                        dark: '#1e293b'
                    },
                    fontFamily: { sans: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-800 flex justify-center items-center h-screen overflow-hidden">

    <!-- Simulasi Frame HP -->
    <div class="relative w-full h-full md:w-[400px] md:h-[850px] bg-white md:rounded-[40px] md:border-[10px] md:border-gray-900 md:shadow-2xl overflow-hidden flex flex-col">
        
        <!-- Status Bar -->
        <div class="hidden md:flex justify-between items-center px-6 pt-3 pb-1 bg-white text-xs font-semibold text-gray-800 z-50">
            <span>09:41</span>
            <div class="flex space-x-2">
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M17 4h-2V2h-2v2H9V2H7v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V8h14v12z"/></svg>
            </div>
        </div>

        <!-- App Header -->
        <header class="bg-white px-5 py-4 flex justify-between items-center shadow-sm z-40 sticky top-0">
            <div class="flex items-center space-x-2">
                <svg class="w-7 h-7 text-primary" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
                <h1 class="text-xl font-bold text-dark">Mancing<span class="text-primary">Yuk!</span></h1>
            </div>
            <button class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
            </button>
        </header>

        <!-- Main Content Area -->
        <main id="app-content" class="flex-1 overflow-y-auto pb-24 bg-gray-50 relative">
            <!-- Konten akan di-render oleh JavaScript -->
        </main>

        <!-- Bottom Navigation -->
        <nav class="absolute bottom-0 w-full bg-white border-t border-gray-200 flex justify-around items-center py-3 pb-5 z-50">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-primary">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span class="text-[10px] font-semibold mt-1">Home</span>
            </button>
            <button onclick="switchTab('explore')" id="nav-explore" class="flex flex-col items-center text-gray-400 hover:text-primary transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <span class="text-[10px] font-medium mt-1">Explore</span>
            </button>
            <button onclick="switchTab('tickets')" id="nav-tickets" class="flex flex-col items-center text-gray-400 hover:text-primary transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z"></path></svg>
                <span class="text-[10px] font-medium mt-1">Tiket</span>
            </button>
            <button onclick="switchTab('owner')" id="nav-owner" class="flex flex-col items-center text-gray-400 hover:text-primary transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
                <span class="text-[10px] font-medium mt-1">Owner</span>
            </button>
        </nav>

        <!-- Modal Detail & Booking -->
        <div id="detailModal" class="absolute inset-0 bg-black bg-opacity-60 hidden z-[60] transition-opacity">
            <div id="detailContent" class="absolute bottom-0 w-full h-[85%] bg-white rounded-t-3xl p-6 transform translate-y-full transition-transform duration-300 overflow-y-auto">
                <!-- Konten Detail akan di-render JS -->
            </div>
        </div>

        <!-- Modal Review -->
        <div id="reviewModal" class="absolute inset-0 bg-black bg-opacity-60 hidden z-[70] flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl w-full max-w-sm p-6 animate-fade-in">
                <h3 class="text-xl font-bold mb-4">Beri Review</h3>
                <div class="flex space-x-2 mb-4 text-2xl text-yellow-400">
                    ★ ★ ★ ★ ★
                </div>
                <textarea class="w-full border rounded-xl p-3 text-sm focus:ring-2 focus:ring-primary outline-none" rows="3" placeholder="Tempatnya nyaman, ikannya banyak! Pasti balik lagi."></textarea>
                <button onclick="submitReview()" class="mt-4 w-full bg-primary text-white py-3 rounded-xl font-bold">Kirim Review</button>
            </div>
        </div>

    </div>

    <script src="js/script.js"></script>
</body>
</html>
